name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: acme_support
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U acme -d acme_support"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Offline deterministic models: CI never calls (or pays) a model provider.
      AI_PROVIDER: fake
      DATABASE_URL: postgres://acme:acme@localhost:5433/acme_support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: acme-support-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
